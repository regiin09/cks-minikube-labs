# Namespace web: Deployment + Service "web-app" (HTTP on 80). The page is identifiable
# so the grader can tell the app answered (not the ingress default backend).
apiVersion: v1
kind: Namespace
metadata: {name: web}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: web-app-html, namespace: web}
data:
  index.html: |
    Q12 web-app: hello from secure.example.local
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web-app, namespace: web}
spec:
  replicas: 1
  selector: {matchLabels: {app: web-app}}
  template:
    metadata: {labels: {app: web-app}}
    spec:
      containers:
      - name: nginx
        image: "nginx:1.27-alpine"
        ports: [{containerPort: 80}]
        volumeMounts: [{name: html, mountPath: /usr/share/nginx/html}]
      volumes:
      - {name: html, configMap: {name: web-app-html}}
---
apiVersion: v1
kind: Service
metadata: {name: web-app, namespace: web}
spec:
  selector: {app: web-app}
  ports: [{port: 80, targetPort: 80, protocol: TCP}]

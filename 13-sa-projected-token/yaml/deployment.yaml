# Starting state. setup.ps1 applies it and break-node.sh copies the Deployment part
# to the node at /opt/course/13/deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-monitor
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stats-monitor
  template:
    metadata:
      labels:
        app: stats-monitor
    spec:
      serviceAccountName: stats-monitor-sa
      containers:
      - name: stats-monitor
        image: busybox:1.36
        command: ["sh", "-c", "trap 'exit 0' TERM; while true; do date; sleep 5; done"]

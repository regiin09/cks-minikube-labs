apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: vulnerable}
  template:
    metadata:
      labels: {app: vulnerable}
    spec:
      containers:
      - name: nginx
        image: nginx:latest

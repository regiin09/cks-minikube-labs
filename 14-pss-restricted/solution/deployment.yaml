# SOLUTION: fixed /opt/course/14/deployment.yaml (every random extra removed)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  namespace: team-red
  labels:
    app: web-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-server
  template:
    metadata:
      labels:
        app: web-server
    spec:
      # hostNetwork: true                 -> removed
      securityContext:                    # pod level: applies to every container
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.27-alpine   # image USER is 101 (numeric)
        ports:
        - containerPort: 8080
        securityContext:                  # container level only
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          # privileged: true              -> removed
          # runAsUser: 0                  -> removed
          # capabilities.add NET_ADMIN    -> removed
      # volumeMounts / volumes hostPath   -> removed

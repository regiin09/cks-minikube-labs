apiVersion: audit.k8s.io/v1 # This is required.
kind: Policy
# Don't generate audit events for all requests in RequestReceived stage.
omitStages:
  - "RequestReceived"
rules:
  # TODO: extend this basic policy with the rules from the task.
  # A catch-all rule - log all other requests at the Metadata level.
  - level: Metadata

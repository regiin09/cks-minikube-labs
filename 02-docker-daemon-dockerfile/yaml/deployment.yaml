# Starting (insecure) state. setup copies it to the node at /opt/course/02/deployment.yaml and applies it.
apiVersion: v1
kind: Namespace
metadata:
  name: secure-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: secure-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: busybox:1.36
        command: ["sh", "-c", "echo running as $(id -u); sleep 1d"]
        securityContext:
          runAsUser: 0
          privileged: true
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false

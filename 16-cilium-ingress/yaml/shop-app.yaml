# Namespace shop: Deployment + Service "shop-app" (HTTP on 80). The page is identifiable
# so the grader can tell the app answered.
apiVersion: v1
kind: Namespace
metadata: {name: shop}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: shop-app-html, namespace: shop}
data:
  index.html: |
    Q16 shop-app: hello from shop.example.local
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop-app, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: shop-app}}
  template:
    metadata: {labels: {app: shop-app}}
    spec:
      containers:
      - name: nginx
        image: "nginx:1.27-alpine"
        ports: [{containerPort: 80}]
        volumeMounts: [{name: html, mountPath: /usr/share/nginx/html}]
      volumes:
      - {name: html, configMap: {name: shop-app-html}}
---
apiVersion: v1
kind: Service
metadata: {name: shop-app, namespace: shop}
spec:
  selector: {app: shop-app}
  ports: [{port: 80, targetPort: 80, protocol: TCP}]
